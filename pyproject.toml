[project]
name = "aspire-mcp"
version = "0.1.0"
description = "MCP server for Vectric Aspire (offline asset tools + Lua gadget bridge)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aspire-mcp = "aspire_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aspire_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
